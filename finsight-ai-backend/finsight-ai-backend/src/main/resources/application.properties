spring.application.name=finsight-ai-backend
server.port=8080

# ==========================
# DATABASE CONFIGURATION
# ==========================
spring.datasource.url=jdbc:mysql://localhost:3306/finsight_ai
spring.datasource.username=root
# Secured with an environment variable fallback to avoid plain text credentials exposed in code repositories
spring.datasource.password=${DB_PASSWORD:Irfan@206}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================
# JPA / HIBERNATE CONFIGURATION
# ==========================
# FIXED: Changed from 'update' to 'create' temporarily to force Hibernate to drop old structural column mismatches
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==========================
# LOGGING CONFIGURATION
# ==========================
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ==========================
# JWT CONFIGURATION
# ==========================
# Secret is pre-configured with a secure, long Base64 encoded placeholder for local development
jwt.secret=${JWT_SECRET:dGhpcy1pcy1hLXNlY3VyZS1hbmQtbG9uZy1iYXNlNjQtZW5jb2RlZC1zZWNyZXQta2V5LWZvci1maW5zaWdodGFpLWJhY2tlbmQ=}
jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}